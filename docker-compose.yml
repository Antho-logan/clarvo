services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: veridicta_m1
      POSTGRES_USER: veridicta
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
