name: Nightly Retrieval Eval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: veridicta_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/veridicta_eval
      AUTH_SECRET: veridicta-eval-placeholder-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-backend.txt -r requirements-dev.txt

      - name: Migrate database
        run: python -m alembic upgrade head

      - name: Seed eval fixtures
        run: python evals/seed_milestone2_eval.py

      - name: Run retrieval eval
        run: python evals/run_milestone2_eval.py --limit 10 --reports-dir evals/reports/ci

      - name: Check nDCG regression
        run: python evals/check_eval_regression.py --baseline evals/reports/baseline.json --latest-dir evals/reports/ci --metric ndcg@10 --max-regression 0.05

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: evals/reports/ci
